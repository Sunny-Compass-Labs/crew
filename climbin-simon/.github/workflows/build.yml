name: Build

# Every merge to main produces an installable debug APK published as a GitHub
# pre-release -- the founder downloads it straight to his phone from the
# Releases page. Owned by build-release-engineer.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.4.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin ~/.local/share/godot/export_templates
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz -d /tmp/godot-templates
          mv /tmp/godot-templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project
        run: ~/godot-bin/godot --headless --path . --import

      - name: Smoke test
        run: ~/godot-bin/godot --headless --path . --script tests/smoke.gd

      - name: Boot check
        run: timeout 60 ~/godot-bin/godot --headless --path . --quit-after 120

      - name: Configure Android export
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME_17_X64}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cp ~/.config/godot/editor_settings-4.4.tres ~/.config/godot/editor_settings-4.tres

      - name: Export debug APK
        run: |
          mkdir -p build
          ~/godot-bin/godot --headless --path . --export-debug "Android" build/climbin-simon.apk
          ls -la build/

      - name: Publish pre-release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'config/version="\K[^"]+' project.godot)
          TAG="v${VERSION}-build${{ github.run_number }}"
          gh release create "$TAG" build/climbin-simon.apk \
            --prerelease \
            --generate-notes \
            --title "Climbin' Simon $TAG"
